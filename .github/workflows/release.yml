name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Verify release tag and source commit
        run: |
          uv run python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          config = tomllib.loads(Path("pyproject.toml").read_text())
          project = config["project"]
          version = project["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if os.environ["GITHUB_EVENT_NAME"] == "release":
              if tag != f"v{version}":
                  raise SystemExit(f"release tag {tag!r} must match project version v{version}")
              if "dspy" in config.get("tool", {}).get("uv", {}).get("sources", {}):
                  raise SystemExit("remove the temporary DSPy source pin before publishing")
              if "license" not in project or not list(Path.cwd().glob("LICENSE*")):
                  raise SystemExit("select and declare a license before publishing")
          PY
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release commit must be reachable from main" >&2
            exit 1
          }
      - run: uv sync --locked --all-extras
      - run: uv run ruff check src tests scripts
      - run: uv run pytest -q
      - run: uv build --no-sources
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dspy-interpreters
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
