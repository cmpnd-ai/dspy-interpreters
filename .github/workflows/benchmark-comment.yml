name: Benchmark PR comment

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  comment:
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.pull_requests[0] != null }}
    runs-on: ubuntu-latest
    steps:
      - name: Download benchmark report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: interpreter-benchmark-report
          path: current-report
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Find prior benchmark run
        id: prior
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const baseSha = context.payload.workflow_run.pull_requests[0].base.sha;
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              head_sha: baseSha,
              event: 'push',
              status: 'completed',
              per_page: 100,
            });
            for (const run of runs) {
              if (run.conclusion !== 'success') continue;
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                per_page: 100,
              });
              if (artifacts.some(artifact =>
                artifact.name === 'interpreter-benchmark-report' && !artifact.expired
              )) {
                core.setOutput('run-id', run.id);
                return;
              }
            }
            core.notice(`No prior benchmark artifact found for base commit ${baseSha}`);
      - name: Download prior benchmark report
        if: ${{ steps.prior.outputs.run-id != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: interpreter-benchmark-report
          path: prior-report
          github-token: ${{ github.token }}
          run-id: ${{ steps.prior.outputs.run-id }}
      - name: Check out trusted summary renderer
        if: ${{ steps.prior.outputs.run-id != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: source
      - name: Set up summary renderer
        if: ${{ steps.prior.outputs.run-id != '' }}
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Compare benchmark reports
        if: ${{ steps.prior.outputs.run-id != '' }}
        run: >-
          uv run --project source python source/scripts/render_benchmark_summary.py
          current-report/benchmark-ci.json
          --previous-report prior-report/benchmark-ci.json
          --output current-report/benchmark-summary.md
      - name: Create or update benchmark comment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- dspy-interpreters-benchmark -->';
            const summary = fs.readFileSync('current-report/benchmark-summary.md', 'utf8').trim();
            const body = `${marker}\n${summary}`;
            const issue_number = context.payload.workflow_run.pull_requests[0].number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            });
            const previous = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker)
            );
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
            }
